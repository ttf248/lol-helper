name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish Windows release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check release tag and app versions
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version

          if ($packageVersion -ne $tauriVersion) {
            throw "package.json ($packageVersion) and tauri.conf.json ($tauriVersion) versions must match."
          }

          if ($env:GITHUB_REF_NAME -ne "v$tauriVersion") {
            throw "Release tag must be v$tauriVersion to match the application version."
          }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: LOL Helper ${{ github.ref_name }}
          releaseBody: Windows x64 installers built automatically from this version tag.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
